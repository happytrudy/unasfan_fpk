name: Build And Release U-NAS Fan FPK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Download fnpack
        run: |
          curl -fsSL \
            https://github.com/shuangji66/buildbot/raw/main/fnpack/fnpack-1.2.1-linux-amd64 \
            -o "$RUNNER_TEMP/fnpack"
          chmod +x "$RUNNER_TEMP/fnpack"

      - name: Set timestamp version
        id: version
        run: |
          VERSION="$(date -u +%Y%m%d%H%M%S)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build FPK
        id: build
        run: |
          make VERSION="$VERSION" FNPACK="$RUNNER_TEMP/fnpack"
          PACKAGE="dist/unasfan_fpk-${VERSION}-x86.fpk"
          test -f "$PACKAGE"
          test -f "$PACKAGE.sha256"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unasfan_fpk-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.build.outputs.package }}
            ${{ steps.build.outputs.package }}.sha256

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" "$PACKAGE.sha256" --clobber
          else
            gh release create "$TAG" "$PACKAGE" "$PACKAGE.sha256" \
              --title "unasfan_fpk ${VERSION}" \
              --generate-notes
          fi
